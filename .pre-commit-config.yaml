# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-added-large-files
  - id: detect-private-key

- repo: local
  hooks:
  - id: gofmt
    name: gofmt
    entry: bash -c 'unformatted=$(gofmt -l .); if [ -n "$unformatted" ]; then echo "Unformatted files:"; echo "$unformatted"; exit 1; fi'
    language: system
    types: [go]
    pass_filenames: false

  - id: go-vet
    name: go vet (v1)
    entry: go vet ./...
    language: system
    types: [go]
    pass_filenames: false

  - id: go-vet-v2
    name: go vet (v2)
    entry: bash -c '[ ! -d v2 ] || (cd v2 && go vet ./...)'
    language: system
    types: [go]
    pass_filenames: false

  - id: go-test
    name: go test -race (v1)
    entry: go test -race ./...
    language: system
    types: [go]
    pass_filenames: false

  - id: go-test-v2
    name: go test -race (v2)
    entry: bash -c '[ ! -d v2 ] || (cd v2 && go test -race ./...)'
    language: system
    types: [go]
    pass_filenames: false
